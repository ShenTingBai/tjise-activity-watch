<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>准点 · 天软活动报名</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="zd" id="zd">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#121513"/><circle cx="14" cy="9.5" r="2.6" fill="#FFB020"/><circle cx="14" cy="18.5" r="2.6" fill="#FFB020"/></svg>
        <div class="brand-text"><span class="brand-name">准点</span><span class="brand-desc">天软活动，到点替你报名</span></div>
      </div>
      <div class="top-right">
        <button class="clock" id="clock" type="button" aria-label="本机时间"><span class="clock-time" id="clock-time">--:--:--</span></button>
        <button class="pill" id="pill" type="button" data-state="unknown"><i aria-hidden="true"></i><b>登录态未知</b></button>
        <span id="status-detail" class="sr-only"></span>
        <span class="top-sep" aria-hidden="true"></span>
        <button class="btn btn-ghost" id="btn-help" type="button"><span class="icon">?</span><span class="lbl">说明</span></button>
        <button class="btn btn-ghost" id="btn-refresh" type="button" title="刷新登录状态和活动列表（F5）"><span class="icon">↻</span><span class="lbl">刷新</span></button>
        <button class="btn btn-line" id="btn-login" type="button"><span class="icon">↪</span><span class="lbl">登录</span></button>
      </div>
    </header>

    <div class="banners" id="banners"></div>

    <section class="board" id="board" aria-label="报名计划" aria-live="polite">
      <div class="b-main">
        <div class="b-tags"><span class="b-tag" data-tone="amber"><i></i>报名计划</span><span class="b-note" id="rail-message">先选活动，系统会检查举办时间冲突。</span></div>
        <h2 class="b-title" id="selected">还没选活动<span>在下方时刻表勾选一场或多场</span></h2>
        <div class="b-sub"><span><b>最近开放</b><strong class="num" id="countdown">待选</strong></span><span><b>列表</b><strong id="metric-total">—</strong></span><span><b>可报名</b><strong id="metric-free">—</strong></span></div>
        <div id="plan-conflicts" class="plan-conflicts" role="alert" hidden></div>
        <div id="plan-tasks" class="plan-tasks" aria-live="polite"></div>
        <p id="result" class="result" role="status" aria-live="assertive" hidden></p>
      </div>
      <aside class="b-side">
        <span class="b-side-label">下一场开放</span><strong class="b-next num" id="metric-next">待公布</strong>
        <label class="headed-option"><input type="checkbox" id="headed"><span>显示浏览器窗口</span></label>
        <div class="b-actions"><button id="btn-plan" class="btn btn-blue btn-action" type="button" disabled>开始报名计划</button><button id="btn-stop" class="btn btn-stop" type="button" disabled>停止</button></div>
        <button id="btn-clear-plan" class="btn btn-ghost btn-clear-plan" type="button">清空选择</button>
        <button id="btn-open" class="link-button" type="button">打开数据目录</button>
      </aside>
    </section>

    <section class="table" aria-label="活动时刻表">
      <div class="filters">
        <label class="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="搜活动名或地点" autocomplete="off" aria-label="搜活动名或地点"></label>
        <div class="seg" id="chips" role="group" aria-label="报名状态"><button class="chip" type="button" data-status="free" aria-selected="false">可报名</button><button class="chip" type="button" data-status="signed" aria-selected="false">已报名</button><button class="chip" type="button" data-status="all" aria-selected="true">全部</button></div>
        <label class="filter-select"><span>开放</span><select id="time" aria-label="开放时间"><option value="all">不限</option><option value="today">今天</option><option value="week">7 天内</option></select></label>
        <label class="filter-select"><span>排序</span><select id="sort" aria-label="排序方式"><option value="open">按开放时间</option><option value="name">按活动名</option></select></label>
        <label class="filter-select"><span>签到</span><select id="checkin" aria-label="签到要求"><option value="all">全部</option><option value="yes">需要</option><option value="no">无需</option></select></label>
        <label class="filter-select"><span>签退</span><select id="checkout" aria-label="签退要求"><option value="all">全部</option><option value="yes">需要</option><option value="no">无需</option></select></label>
        <span class="meta" id="count">—</span>
      </div>
      <div class="list" id="list" tabindex="0">
        <table class="activity-table"><thead><tr><th class="c-select">选</th><th class="c-left">距开放</th><th class="c-time">报名开始</th><th class="c-state">状态</th><th class="c-name">活动 / 举办时间</th><th class="c-place">地点</th></tr></thead><tbody id="rows"></tbody></table>
        <div id="empty" class="empty" hidden><div class="empty-mark">⌁</div><p id="empty-title">这里还没有活动</p><p id="empty-text">点「刷新」拉一次；提示登录态失效就先点「登录」。</p><button id="empty-action" class="btn btn-line btn-mini" type="button" hidden>刷新</button></div>
      </div>
    </section>

    <footer class="logbar log-card" id="logbar" data-open="false">
      <div class="logbar-head"><span class="logbar-title">运行记录</span><span class="logbar-last">只显示本机脚本原话</span><div class="logbar-tools"><button class="btn btn-ghost" type="button" id="btn-log-clear">清空</button><button class="btn btn-ghost" type="button" id="btn-log-toggle" aria-expanded="false">展开</button></div></div>
      <pre class="logbody log" id="log" role="log" aria-label="运行记录"></pre>
    </footer>
  </div>

  <dialog class="dlg" id="help" aria-labelledby="help-title">
    <div class="dlg-head"><h2 id="help-title">准点怎么用</h2><p id="help-sub">登录一次，选好活动，开放时按计划提交。</p></div>
    <div class="dlg-body"><ol class="steps" id="help-steps"></ol><p class="rules" id="help-note"></p></div>
    <div class="dlg-foot"><span class="grow"></span><form method="dialog"><button class="btn btn-solid" type="submit">知道了</button></form></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
